name: Repository Benchmarks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmarks/corpus.json'
      - 'engine/profiles/**'
      - 'scripts/profile_repository.py'
      - 'scripts/resolve_stack_profile.py'
      - 'scripts/run_repository_benchmarks.py'
      - '.github/workflows/repository-benchmarks.yml'
permissions:
  contents: read
jobs:
  profile-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/run_repository_benchmarks.py
