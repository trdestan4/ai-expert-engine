name: AI Expert Release Gate
on:
  workflow_call:
    inputs:
      decision_path:
        required: false
        type: string
        default: .ai-expert-engine/evidence/release-decision.json
      environment:
        required: false
        type: string
        default: production
      acknowledge_conditions:
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Enforce release decision
        env:
          AI_EXPERT_RELEASE_CONDITIONS_ACK: ${{ inputs.acknowledge_conditions }}
        run: python scripts/release_gate.py --decision "${{ inputs.decision_path }}" --candidate "${{ github.sha }}" --environment "${{ inputs.environment }}"
