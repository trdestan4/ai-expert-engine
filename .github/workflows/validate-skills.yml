name: Validate Skills
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run skill and runtime validators
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          validators=(scripts/validate_*.py)
          if (( ${#validators[@]} == 0 )); then echo 'No validators found'; exit 1; fi
          for validator in "${validators[@]}"; do
            echo "::group::$validator"
            python "$validator"
            echo '::endgroup::'
          done
      - name: Validate offline eval corpora and freshness metadata
        run: |
          python scripts/run_behavioral_evals.py --validate-corpus
          python scripts/run_context_drift_evals.py --validate-corpus
          python scripts/run_reviewer_calibration.py --validate-corpus
          python scripts/run_repository_benchmarks.py --validate-corpus
          python scripts/check_knowledge_freshness.py
          python scripts/check_release_enforcement.py --root .
