name: Behavioral Evals
on:
  workflow_dispatch:
    inputs:
      repeat:
        required: false
        default: "1"
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: read
jobs:
  behavioral:
    runs-on: ubuntu-latest
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      CURSOR_EVAL_MODEL: ${{ vars.CURSOR_EVAL_MODEL || 'auto' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python scripts/run_behavioral_evals.py --validate-corpus
      - id: creds
        shell: bash
        run: |
          if [ -n "$CURSOR_API_KEY" ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.creds.outputs.available == 'true'
        run: python -m pip install --disable-pip-version-check cursor-sdk==1.0.24
      - if: steps.creds.outputs.available == 'true'
        run: python scripts/run_behavioral_evals.py --repeat "${{ inputs.repeat || '1' }}"
